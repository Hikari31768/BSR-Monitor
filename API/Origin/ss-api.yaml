openapi: 3.0.0
info:
  title: ScoreSaber Public API
  description: |
    ScoreSaber's Public API

    Please note this API is in constant development and is subject to change, so if there are any errors please dont hesitate to contact us.

    The current global rate limit is set at a pretty high 400 requests per minute, if for some reason you need higher than this please contact us with your reasoning and we may be able to supply you with special access
  contact:
    email: contact@scoresaber.com
  version: 1.0.0
servers:
  - url: 'https://scoresaber.com'
    description: Production server
paths:
  /api/leaderboards:
    get:
      summary: Get a list of leaderboards based on filters
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          explode: true
          style: form
        - name: verified
          in: query
          description: Filter by verified (⚠️️deprecation notice)
          required: false
          schema:
            type: boolean
          explode: true
          style: form
        - name: ranked
          in: query
          description: Filter by ranked
          required: false
          schema:
            type: boolean
          explode: true
          style: form
        - name: qualified
          in: query
          description: Filter by qualified
          required: false
          schema:
            type: boolean
          explode: true
          style: form
        - name: loved
          in: query
          description: Filter by loved
          required: false
          schema:
            type: boolean
          explode: true
          style: form
        - name: minStar
          in: query
          description: Filter by minimum star value
          required: false
          schema:
            type: number
          explode: true
          style: form
        - name: maxStar
          in: query
          description: Filter by maxiumum star value
          required: false
          schema:
            type: number
          explode: true
          style: form
        - name: category
          in: query
          description: 'Which category to sort by (0 = trending, date ranked = 1, scores set = 2, star difficulty = 3, author = 4)'
          required: false
          schema:
            type: number
            maximum: 4
            minimum: 0
          explode: true
          style: form
        - name: sort
          in: query
          description: 'Which direction to sort (0 = descending, 1 = ascending)'
          required: false
          schema:
            type: number
            maximum: 1
            minimum: 0
          explode: true
          style: form
        - name: unique
          in: query
          description: Only return one leaderboard of each id
          required: false
          schema:
            type: boolean
          explode: true
          style: form
        - name: page
          in: query
          required: false
          schema:
            type: integer
          explode: true
          style: form
        - name: withMetadata
          in: query
          description: (default true)
          required: false
          schema:
            type: boolean
          explode: true
          style: form
      responses:
        '200':
          description: A list of leaderboards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardInfoCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Leaderboards
  '/api/leaderboard/by-id/{leaderboardId}/info':
    get:
      summary: Gets leaderboard information by ScoreSaber leaderboardId
      parameters:
        - name: leaderboardId
          in: path
          description: ScoreSaber leaderboardId
          required: true
          schema:
            type: number
          explode: false
          style: simple
      responses:
        '200':
          description: Leaderboard information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Leaderboards
  '/api/leaderboard/by-hash/{hash}/info':
    get:
      summary: Gets leaderboard information by map hash
      parameters:
        - name: hash
          in: path
          description: Map hash
          required: true
          schema:
            type: string
          explode: false
          style: simple
        - name: difficulty
          in: query
          description: '(1 = Easy, 3 = Normal, 5 = Hard, 7 = Expert, 9 = Expert+)'
          required: true
          schema:
            type: integer
          explode: true
          style: form
        - name: gameMode
          in: query
          description: (e.g SoloStandard)
          required: false
          schema:
            type: string
          explode: true
          style: form
      responses:
        '200':
          description: Leaderboard information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Leaderboards
  '/api/leaderboard/by-id/{leaderboardId}/scores':
    get:
      summary: Gets leaderboard scores by ScoreSaber leaderboardId
      parameters:
        - name: leaderboardId
          in: path
          description: ScoreSaber leaderboardId
          required: true
          schema:
            type: number
          explode: false
          style: simple
        - name: countries
          in: query
          description: Filter by ISO 3166-1 alpha-2 code (comma delimitered)
          required: false
          schema:
            type: string
          explode: true
          style: form
        - name: search
          in: query
          required: false
          schema:
            type: string
          explode: true
          style: form
        - name: page
          in: query
          required: false
          schema:
            type: integer
          explode: true
          style: form
        - name: withMetadata
          in: query
          description: (default true)
          required: false
          schema:
            type: boolean
          explode: true
          style: form
      responses:
        '200':
          description: A colleciton of Score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Leaderboards
  '/api/leaderboard/by-hash/{hash}/scores':
    get:
      summary: Gets leaderboard scores by map hash
      parameters:
        - name: hash
          in: path
          description: Map hash
          required: true
          schema:
            type: string
          explode: false
          style: simple
        - name: difficulty
          in: query
          description: '(1 = Easy, 3 = Normal, 5 = Hard, 7 = Expert, 9 = Expert+)'
          required: true
          schema:
            type: integer
          explode: true
          style: form
        - name: countries
          in: query
          description: Filter by ISO 3166-1 alpha-2 code (comma delimitered)
          required: false
          schema:
            type: string
          explode: true
          style: form
        - name: search
          in: query
          required: false
          schema:
            type: string
          explode: true
          style: form
        - name: page
          in: query
          required: false
          schema:
            type: integer
          explode: true
          style: form
        - name: gameMode
          in: query
          description: (e.g SoloStandard)
          required: false
          schema:
            type: string
          explode: true
          style: form
        - name: withMetadata
          in: query
          description: (default true)
          required: false
          schema:
            type: boolean
          explode: true
          style: form
      responses:
        '200':
          description: A collection of Score
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoreCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Leaderboards
  '/api/leaderboard/get-difficulties/{hash}':
    get:
      summary: Gets a leaderboards difficulties by hash
      parameters:
        - name: hash
          in: path
          description: Map hash
          required: true
          schema:
            type: string
          explode: false
          style: simple
      responses:
        '200':
          description: An Array of Difficulty
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Difficulty'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Leaderboards
  /api/players:
    get:
      summary: Get a list of players based on filters
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          explode: true
          style: form
        - name: page
          in: query
          required: false
          schema:
            type: number
          explode: true
          style: form
        - name: countries
          in: query
          description: Filter by ISO 3166-1 alpha-2 code (comma delimitered)
          required: false
          schema:
            type: string
          explode: true
          style: form
        - name: withMetadata
          in: query
          description: (default true)
          required: false
          schema:
            type: boolean
          explode: true
          style: form
      responses:
        '200':
          description: A collection of Player
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Players
  /api/players/count:
    get:
      summary: Get a list of active players based on filters
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          explode: true
          style: form
        - name: countries
          in: query
          description: Filter by ISO 3166-1 alpha-2 code (comma delimitered)
          required: false
          schema:
            type: string
          explode: true
          style: form
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: number
                example: 399
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Players
  '/api/player/{playerId}/basic':
    get:
      summary: Gets a players basic information
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
          explode: false
          style: simple
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Players
  '/api/player/{playerId}/full':
    get:
      summary: Gets all the players information
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
          explode: false
          style: simple
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Players
  '/api/player/{playerId}/scores':
    get:
      summary: Gets scores by playerId
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
          explode: false
          style: simple
        - name: limit
          in: query
          description: The amount of scores to return
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
          explode: true
          style: form
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - top
              - recent
          explode: true
          style: form
        - name: page
          in: query
          description: Page
          required: false
          schema:
            type: integer
          explode: true
          style: form
        - name: withMetadata
          in: query
          description: (default true)
          required: false
          schema:
            type: boolean
          explode: true
          style: form
      responses:
        '200':
          description: A collection of PlayerScore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerScoreCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Players
  /api/auth/getToken:
    get:
      summary: Gets logged in users auth token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IGetTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Website Auth
  /api/auth/checkToken:
    post:
      summary: Checks users auth token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/check_token_body'
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Website Auth
  /api/auth/logout:
    get:
      summary: Logs out a logged in user
      responses:
        '200':
          description: OK
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Website Auth
  '/api/user/{playerId}/refresh':
    get:
      summary: Get logged in user information
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
          explode: false
          style: simple
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Website User
  /api/user/@me:
    get:
      summary: Get logged in user information
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Website User
  /api/user/quest-key:
    get:
      summary: Generates a new quest key if one doesn't exist
      responses:
        '200':
          description: The quest key
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Website User
  /api/ranking/requests/top:
    get:
      summary: Gets the top 6 rank requests -⚠️deprecation notice
      responses:
        '200':
          description: An Array of RankRequestListing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankRequestListing'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Public Ranking
  /api/ranking/requests/belowTop:
    get:
      summary: Gets the rest of the ranking requests - ⚠️deprecation notice
      responses:
        '200':
          description: An Array of RankRequestListing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RankRequestListing'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Public Ranking
  '/api/ranking/request/{requestId}':
    get:
      summary: Gets rank request information by requestId
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: number
          explode: false
          style: simple
      responses:
        '200':
          description: Rank request information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankRequestInformation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Public Ranking
  '/api/ranking/request/by-id/{leaderboardId}':
    get:
      summary: Gets rank request information by ScoreSaber leaderboardId
      parameters:
        - name: leaderboardId
          in: path
          description: ScoreSaber leaderboardId
          required: true
          schema:
            type: number
          explode: false
          style: simple
      responses:
        '200':
          description: Rank request information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankRequestInformation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Public Ranking
  /api/ranking/request/action/rt/create:
    post:
      summary: Creates a rank request
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/rt_create_body'
      responses:
        '200':
          description: The created requestId
          content:
            text/plain:
              schema:
                type: number
                example: 6534
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Ranking Team
  /api/ranking/request/action/rt/vote:
    post:
      summary: Votes on a given rank request
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/rt_vote_body'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Ranking Team
  /api/ranking/request/action/rt/comment:
    post:
      summary: Comments on a given rank request
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/rt_comment_body'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Ranking Team
  /api/ranking/request/action/qat/vote:
    post:
      summary: Votes on a given rank request
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/qat_vote_body'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Quality Assurance Team
  /api/ranking/request/action/qat/comment:
    post:
      summary: Comments on a given rank request
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/qat_comment_body'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Quality Assurance Team
  /api/ranking/request/action/nat/replace:
    post:
      summary: Replaces a rank requests leaderboardId
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/nat_replace_body'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Nomination Assessment Team
  /api/ranking/request/action/nat/qualify:
    post:
      summary: Qualifies a rank request
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/nat_qualify_body'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Nomination Assessment Team
  /api/ranking/request/action/nat/deny:
    post:
      summary: Denies a rank request
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/nat_deny_body'
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - Nomination Assessment Team
components:
  schemas:
    Metadata:
      type: object
      properties:
        total:
          type: number
        page:
          type: number
        itemsPerPage:
          type: number
      additionalProperties: false
      required:
        - itemsPerPage
        - page
        - total
    LeaderboardInfo:
      type: object
      properties:
        id:
          type: number
        songHash:
          type: string
        songName:
          type: string
        songSubName:
          type: string
        songAuthorName:
          type: string
        levelAuthorName:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        maxScore:
          type: number
        createdDate:
          type: string
          format: date-time
        rankedDate:
          type: string
          format: date-time
          nullable: true
        qualifiedDate:
          type: string
          format: date-time
          nullable: true
        lovedDate:
          type: string
          format: date-time
          nullable: true
        ranked:
          type: boolean
        qualified:
          type: boolean
        loved:
          type: boolean
        maxPP:
          type: number
        stars:
          type: number
        positiveModifiers:
          type: boolean
        plays:
          type: number
        dailyPlays:
          type: number
        coverImage:
          type: string
        playerScore:
          allOf:
            - $ref: '#/components/schemas/Score'
          nullable: true
        difficulties:
          type: array
          items:
            $ref: '#/components/schemas/Difficulty'
      required:
        - coverImage
        - createdDate
        - dailyPlays
        - difficulties
        - difficulty
        - difficultyRaw
        - id
        - levelAuthorName
        - loved
        - lovedDate
        - maxPP
        - maxScore
        - playerScore
        - plays
        - positiveModifiers
        - qualified
        - qualifiedDate
        - ranked
        - rankedDate
        - songAuthorName
        - songHash
        - songName
        - songSubName
        - stars
    LeaderboardInfoCollection:
      type: object
      properties:
        leaderboards:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardInfo'
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
      required:
        - leaderboards
        - metadata
    LeaderboardPlayer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
